services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  localstack:
    build: ./infra/localstack
    image: wagering-localstack:phase7
    container_name: wagering-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_STRATEGY: dynamic
      SQS_VISIBILITY_SECONDS: ${SQS_VISIBILITY_SECONDS:-90}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo > /dev/null && awslocal sqs get-queue-url --queue-name wager-transactions-dlq.fifo > /dev/null && awslocal sqs get-queue-url --queue-name wager-events.fifo > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    container_name: wagering-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-dev-admin-password}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_DB: dev-file
    mem_limit: 1g
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9090}:9000"
    volumes:
      - ./infra/keycloak/jungle-gaming-realm.json:/opt/keycloak/data/import/jungle-gaming-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

volumes:
  postgres_data:
